# ============================================================
# QUANT RESEARCH AUTOMATION — LEVEL 9.5
# ============================================================
#
# PURPOSE:
#
# This level activates the real Kaggle connection.
#
# CURRENT ARCHITECTURE:
#
# GitHub
#    ↓
# GitHub Actions
#    ↓
# Python (hello.py)
#    ↓
# Experiment
#    ↓
# Kaggle API push
#    ↓
# Kaggle executes level9_kaggle.py
#    ↓
# GitHub Actions pulls the result back
#    ↓
# GitHub Artifact
#
# NEXT:
#
# Level 10 → AI analysis
#
# ============================================================


name: Quant Research Test


on:

  push:

  workflow_dispatch:

    inputs:

      force_rerun:

        description: "Run even if parameters.json has not changed"

        required: false

        type: boolean

        default: false


permissions:

  contents: write


concurrency:

  group: quant-research-experiments

  cancel-in-progress: false


jobs:

  run-python:

    runs-on: ubuntu-latest


    steps:


      - name: Step 1 - Get repository

        uses: actions/checkout@v5


      - name: Step 2 - Setup Python

        uses: actions/setup-python@v6

        with:

          python-version: "3.12"


      - name: Step 3 - Run research experiment

        env:

          FORCE_RERUN: ${{ github.event.inputs.force_rerun || 'false' }}

        run: |

          echo "=============================================="

          echo "RUNNING QUANT RESEARCH EXPERIMENT"

          echo "=============================================="

          echo ""

          python hello.py


      - name: Step 4 - Verify experiment output

        run: |

          echo "=============================================="

          echo "VERIFYING EXPERIMENT OUTPUT"

          echo "=============================================="

          echo ""


          if [ ! -d "experiments" ]; then

            echo "ERROR: experiments directory does not exist."

            exit 1

          fi


          echo "Experiments directory exists."

          echo ""

          echo "Files currently inside experiments:"

          find experiments -type f -print


          echo ""

          echo "Experiment verification successful."


      - name: Step 5 - Show leaderboard

        run: |

          echo "=============================================="

          echo "CURRENT LEADERBOARD"

          echo "=============================================="

          echo ""


          if [ -f leaderboard.csv ]; then

            cat leaderboard.csv

          else

            echo "WARNING: leaderboard.csv does not exist."

          fi


      - name: Step 6 - Save experiment archive

        uses: actions/upload-artifact@v4

        with:

          name: experiment-history-${{ github.run_id }}

          path: |

            experiments/

            leaderboard.csv


      - name: Step 7 - Install Kaggle CLI

        run: |

          echo "=============================================="

          echo "INSTALLING KAGGLE CLI"

          echo "=============================================="

          echo ""


          python -m pip install --upgrade pip


          pip install kaggle


          echo ""

          echo "Kaggle CLI installed."


          echo ""

          echo "Kaggle version:"

          kaggle --version


      - name: Step 8 - Prepare Kaggle research package

        run: |

          echo "=============================================="

          echo "PREPARING KAGGLE RESEARCH PACKAGE"

          echo "=============================================="

          echo ""


          rm -rf kaggle_upload


          mkdir -p kaggle_upload


          if [ -d "experiments" ]; then

            cp -r experiments/. kaggle_upload/

          fi


          if [ -f leaderboard.csv ]; then

            cp leaderboard.csv kaggle_upload/

          fi


          if [ -f parameters.json ]; then

            cp parameters.json kaggle_upload/

          fi


          echo "Kaggle package contents:"

          find kaggle_upload -type f -print


      - name: Step 9 - Verify Kaggle package

        run: |

          echo "=============================================="

          echo "VERIFYING KAGGLE PACKAGE"

          echo "=============================================="

          echo ""


          if [ ! -d "kaggle_upload" ]; then

            echo "ERROR: kaggle_upload directory does not exist."

            exit 1

          fi


          file_count=$(find kaggle_upload -type f | wc -l)


          echo "Files found: $file_count"


          if [ "$file_count" -eq 0 ]; then

            echo "ERROR: Kaggle package contains no files."

            exit 1

          fi


          echo "Kaggle package verification successful."


      - name: Step 10 - Save Kaggle package

        uses: actions/upload-artifact@v4

        with:

          name: kaggle-research-package-${{ github.run_id }}

          path: kaggle_upload/


      # ======================================================
      # STEP 11
      # CONFIGURE KAGGLE CREDENTIALS
      # ======================================================
      #
      # KAGGLE_API_TOKEN holds the full contents of the
      # kaggle.json file downloaded from Kaggle's API settings.
      #
      # ======================================================

      - name: Step 11 - Configure Kaggle credentials

        env:

          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

        run: |

          echo "=============================================="

          echo "CONFIGURING KAGGLE CREDENTIALS"

          echo "=============================================="

          echo ""


          if [ -z "$KAGGLE_API_TOKEN" ]; then

            echo "ERROR: KAGGLE_API_TOKEN secret is not set."

            exit 1

          fi


          mkdir -p ~/.kaggle

          echo "$KAGGLE_API_TOKEN" > ~/.kaggle/kaggle.json

          chmod 600 ~/.kaggle/kaggle.json


          echo "Kaggle credentials configured."


      # ======================================================
      # STEP 12
      # SEND CODE TO KAGGLE
      # ======================================================

      - name: Step 12 - Send code to Kaggle

        run: |

          echo "=============================================="

          echo "PUSHING CODE TO KAGGLE"

          echo "=============================================="

          echo ""


          kaggle kernels push -p kaggle/


          echo ""

          echo "Code sent to Kaggle. Kaggle will now run it."


      # ======================================================
      # STEP 13
      # WAIT FOR KAGGLE TO FINISH RUNNING IT
      # ======================================================

      - name: Step 13 - Wait for Kaggle execution

        run: |

          echo "=============================================="

          echo "WAITING FOR KAGGLE EXECUTION"

          echo "=============================================="

          echo ""


          KERNEL="Just-Trying-10349/quanfirst-level9"


          for attempt in $(seq 1 30)

          do

            STATUS=$(kaggle kernels status "$KERNEL")

            echo "$STATUS"


            if echo "$STATUS" | grep -q "complete"; then

              echo ""

              echo "Kaggle finished running the code."

              break

            fi


            if echo "$STATUS" | grep -q "error"; then

              echo ""

              echo "ERROR: Kaggle run failed."

              exit 1

            fi


            sleep 10

          done


      # ======================================================
      # STEP 14
      # RETRIEVE KAGGLE'S OUTPUT
      # ======================================================

      - name: Step 14 - Retrieve Kaggle output

        run: |

          echo "=============================================="

          echo "RETRIEVING KAGGLE OUTPUT"

          echo "=============================================="

          echo ""


          rm -rf kaggle_result


          kaggle kernels output "Just-Trying-10349/quanfirst-level9" -p kaggle_result/


          echo ""

          echo "Files returned by Kaggle:"

          find kaggle_result -type f -print


      # ======================================================
      # STEP 15
      # VERIFY THE RESULT ACTUALLY CAME FROM KAGGLE
      # ======================================================

      - name: Step 15 - Verify Kaggle result

        run: |

          echo "=============================================="

          echo "VERIFYING KAGGLE RESULT"

          echo "=============================================="

          echo ""


          if [ -f kaggle_result/kaggle_result.json ]; then

            echo "SUCCESS: this result was produced by Kaggle."

            echo ""

            cat kaggle_result/kaggle_result.json

          else

            echo "ERROR: kaggle_result.json was not returned by Kaggle."

            exit 1

          fi


          echo ""

          echo "Kaggle execution log:"

          echo "----------------------------------------------"

          cat kaggle_result/*.log 2>/dev/null || echo "(no log file returned)"

          echo "----------------------------------------------"


      - name: Step 16 - Save Kaggle result

        uses: actions/upload-artifact@v4

        with:

          name: kaggle-execution-result-${{ github.run_id }}

          path: kaggle_result/


      - name: Step 17 - Save experiment memory

        run: |

          echo "=============================================="

          echo "SAVING EXPERIMENT MEMORY"

          echo "=============================================="

          echo ""


          git config --global user.name "github-actions"

          git config --global user.email "github-actions@github.com"


          git add leaderboard.csv


          git commit \
            -m "Update experiment leaderboard (${{ github.run_id }})" \
            || echo "No leaderboard changes to commit."


          for attempt in 1 2 3 4 5

          do

            git pull --rebase origin "${GITHUB_REF_NAME}" \
              && git push \
              && break


            echo ""

            echo "Push attempt $attempt failed."

            echo "Retrying..."


            sleep $((RANDOM % 5 + 1))

          done


      - name: Step 18 - Level 9.5 complete

        run: |

          echo ""

          echo "======================================================"

          echo "LEVEL 9.5 COMPLETED"

          echo "======================================================"

          echo ""

          echo "GitHub sent the code. Kaggle imported its own"

          echo "libraries, ran it, and returned the real result."

          echo ""

          echo "======================================================"
